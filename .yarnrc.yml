nodeLinker: node-modules

# Audit exceptions. `yarn npm audit` reads this list on every run, so the
# command is the same locally and in .github/workflows/security.yml. Each entry
# is one numeric advisory ID — Yarn matches on that ID alone, so a new advisory
# against the same package carries a new ID and still fails the audit. Never a
# package name, never a glob, never a lowered --severity.
#
# An entry is allowed only when no release fixes the advisory and no dependent
# can move off the package. Each one names the advisory, why it cannot reach
# this repository's input, and what removes it. Re-check them whenever the
# audit job is next touched.
npmAuditIgnoreAdvisories:
  # GHSA-vfj7-8cjw-p6xm, braces <=3.0.3: deeply nested brace patterns
  # exhaust the stack. No patched release; 3.0.3 is the latest, and upstream
  # issue micromatch/braces#70 is open with no fix. Its only dependent is
  # micromatch 4.0.8, already the latest, and http-proxy-middleware 4.2.0
  # still requires that micromatch, so no upgrade moves off it. braces
  # expands the glob pattern, never the string tested against it. The gateway's pathFilter is '/runs', which is not a glob, so
  # http-proxy-middleware prefix-matches and never calls micromatch; the
  # other path is jest. Remove when braces ships a release past 3.0.3.
  - '1240992'
  # GHSA-ch52-4w7c-c8xp, http-cache-semantics <=4.2.0: a client max-stale
  # serves a shared-cache entry that was zeroed for carrying Set-Cookie. No
  # patched release, and upstream issue #56 was closed as not planned. 4.3.0
  # exists and sits outside the audit range, but its diff from 4.2.0 leaves
  # the max-stale path untouched, so moving to it would silence the audit
  # without fixing anything. The only path is fsevents -> node-gyp ->
  # make-fetch-happen: a macOS-only optional build dependency, not installed
  # on Linux or in the images, whose cache holds Node headers for one local
  # user. Remove when a release fixes the max-stale check.
  - '1240991'

yarnPath: .yarn/releases/yarn-4.13.0.cjs
