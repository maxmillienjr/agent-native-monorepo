services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '[]'
    ports:
      - '${NEO4J_HTTP_HOST_PORT:-7474}:7474'
      - '${NEO4J_BOLT_HOST_PORT:-7687}:7687'
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ['CMD', 'neo4j', 'status']
      interval: 10s
      timeout: 10s
      retries: 10

  # One-shot: writes the Agent Card's signing key into a named volume the first
  # time the stack comes up, and leaves it there after (P5-A). No private key is
  # in the repository; this is where the stack's comes from.
  a2a-keygen:
    profiles: ['full']
    image: node:24-alpine
    command: ['node', '/a2a-keygen.mjs', '/keys/card-signing.pem', '--owner', '1001:1001']
    volumes:
      - ./scripts/a2a-keygen.mjs:/a2a-keygen.mjs:ro
      - a2a-keys:/keys

  agent-service:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/agent-service/Dockerfile
      # Names the image's commit in every run record (P3-B). Set it with
      # `GIT_SHA=$(git rev-parse HEAD) docker compose --profile full up --build`.
      args:
        GIT_SHA: ${GIT_SHA:-}
    ports:
      - '${AGENT_SERVICE_HOST_PORT:-3000}:3000'
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/agentdb
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: agent-service
      # Service authentication is on in the stack (P5-A). Digests of two demo
      # tokens, `console-demo-token` and `tck-demo-token`, with the same standing
      # as POSTGRES_PASSWORD above: values for a local stack, not secrets.
      SERVICE_CREDENTIALS: console:50698bf35afbe0a8b780bcc783b9511fb5ad2f961feb1e5186797369641a3ec2,tck:2668e973a0ed24adab1209a840ed18ff026873d3f82103f4a119b9039f4214c7
      # Where a caller reaches the service, for the card's interface URL: the
      # gateway. The TCK job points it at its auth proxy instead.
      A2A_PUBLIC_URL: ${A2A_PUBLIC_URL:-http://localhost:3001}
      A2A_CARD_SIGNING_KEYS: /keys/card-signing.pem
    volumes:
      - a2a-keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      a2a-keygen:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  gateway:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    ports:
      - '${GATEWAY_HOST_PORT:-3001}:3001'
    environment:
      AGENT_SERVICE_URL: http://agent-service:3000
      GATEWAY_PORT: '3001'
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: gateway
    depends_on:
      agent-service:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  console:
    profiles: ['full']
    build:
      context: .
      dockerfile: apps/console/Dockerfile
    ports:
      - '${CONSOLE_HOST_PORT:-8080}:80'
    environment:
      # Substituted into nginx's Authorization header at start (P5-A).
      CONSOLE_SERVICE_TOKEN: console-demo-token
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: nginx's `listen 80` binds IPv4 only, while
      # localhost resolves to ::1 first inside the container, so the check failed
      # with "connection refused" against a container that was serving fine.
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:80/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  neo4jdata:
  a2a-keys:
