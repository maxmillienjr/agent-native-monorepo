name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      # The pull_request trigger catches an advisory a PR introduces. The
      # schedule is what catches an advisory published against dependencies
      # that never changed, which is how 20 of them accumulated here unseen.
      #
      # This also guards the scoped `vitest/vite` and `vite-node/vite`
      # resolutions plus the ranged `brace-expansion@<range>` and
      # `js-yaml@<range>` ones in package.json. Yarn's parent/child and ranged
      # resolutions only bind while the descriptor still matches, and when they
      # stop matching they are ignored silently: install still exits 0. Without
      # this job, a dropped pin looks exactly like a passing build.
      #
      # The three GHSA-q7rr-3cgh-j5r3 ignores (1120251/1120252/1120253) are
      # gone: the OTel migration they were waiting on has landed, sdk-node and
      # exporter-prometheus are on 0.220, and the advisory no longer fires.
      #
      # The last remaining ignore is gone too. GHSA-mh99-v99m-4gvg, the
      # brace-expansion unbounded-expansion OOM, was ignored because it had no
      # patched release on any major and the 1.x and 2.x lines had nothing to
      # move to. 1.1.17 and 2.1.3 have since shipped, so the resolutions now
      # clear it by version instead of by exception, and the "waits on upstream
      # dropping minimatch ^3" note no longer applies.
      #
      # Both ignores were pinned to advisory IDs rather than package globs, and
      # the comment predicted that a NEW brace-expansion advisory would carry a
      # new ID and still fail this job. That is exactly what happened:
      # GHSA-rgw5-rvv9-x895 landed, explicitly bypassing the CVE-2026-14257
      # mitigation, range >=4.0.0 <5.0.9, against a 5.x tree pinned to 5.0.8.
      # One patch short. ID-scoped ignores are why it surfaced rather than being
      # swallowed by a package-name exception. Keep future ignores ID-scoped.
      #
      # Ignores no longer go on this command line. They live in
      # `npmAuditIgnoreAdvisories` in .yarnrc.yml, one numeric ID per entry
      # with its reasoning and its removal condition beside it, so a local
      # `yarn npm audit` gives the same verdict as this job. Two are there now,
      # braces and http-cache-semantics, because neither has a release that
      # fixes its advisory.
      - name: Audit for high/critical vulnerabilities
        run: yarn npm audit --all --recursive --severity high
