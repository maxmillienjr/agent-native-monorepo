name: Agent Eval

# Two tiers of the same suite (P1-C, ADR 0005).
#
# The replay job also replays two suites as further steps, each with its own
# cassettes, its own baseline and its own report, so neither rate shares a
# denominator with memory-recall's. Prior-auth (P3-D), `EVAL_SUITE=prior-auth`,
# is twenty generateContent calls for one trial of every task, and the
# memory-poisoning red team (P4-B), `EVAL_SUITE=red-team`, is twelve. Neither is
# in the live job, which spends about twelve on memory-recall: the rotation job
# below runs them on the live model a slice a night instead (P1-H).
#
#   replay  every pull request, every push to main, and nightly. The model's
#           decisions come from the committed cassettes, so it makes no model
#           call and needs no key; the memory axis is live, against the two
#           service containers. A failed trial here means something changed.
#   live    nightly and on dispatch, only when a GOOGLE_API_KEY repository
#           secret exists. It catches what replay cannot: the model getting
#           worse and the client breaking. About eight generateContent calls
#           per trial, against a daily free tier of twenty.
#
# Two more jobs watch the model itself (P1-E), under the same secret gate:
#
#   canary  nightly and on dispatch. `yarn canary` asks the API what serves
#           the pinned ids and the floating alias, and embeds the 21 baseline
#           texts. Red when anything behind a pinned id changed; the way back
#           to green is a committed baseline update. 2 generateContent calls,
#           one per chat id, each on its model's quota. (P1-I's candidate probe
#           ran from 2026-11-09 until the switch made the candidate the pin.)
#   compare after the live job. The night's recorded decisions against the
#           committed cassettes, read from the live artifact. No model call.
#
# And one more spends what the night has left on the two replay-only suites
# (P1-H):
#
#   rotation  nightly, after live and canary, in their concurrency group. It
#           reads what they spent from the eval-live artifact, takes a budget of
#           L − S − R (L the recorded free-tier limit, EVAL_ROTATION_DAILY_LIMIT
#           below; S tonight's spend; R = 1 for a 5xx retry), and runs the
#           least-covered prior-auth and red-team tasks that fit, one trial
#           each, pooling their tallies on eval-history. With L empty it runs
#           nothing and warns. Red on `regressed`, an abort, a budget breach, or
#           one live failure of no_false_approval or a canary_absent grader. In
#           no ruleset: a nightly signal, not a merge gate.
#
# The repository variable EVAL_SCHEDULE_PAUSED pauses the schedule and leaves
# dispatch alone. `true` skips the scheduled live and canary jobs, so a day's
# twenty calls can go to a recording. `live` skips the scheduled live job alone
# and keeps the canary, which spends one call on the pinned pool (P1-I set it
# while P2-D's stage 2 held that pool). Both skip the rotation, which needs the
# live job. `rotation` skips the scheduled rotation alone, to leave its share of
# the day to a free-key dispatch planned for the same Pacific day.
# Replay still runs nightly: it makes no model call.
#
# What goes red is the regression gate's verdict (P1-D), not "a trial failed":
#
#   replay  EVAL_GATE=replay compares every (task, trial, grader) cell with the
#           committed baselines/replay.json. Any difference blocks, an
#           improvement included, and so does an aborted run. `eval-replay` is
#           the check .github/rulesets/main.json makes required.
#   live    EVAL_GATE=live appends the night's tally to the orphan eval-history
#           branch and compares the pooled epoch with baselines/live.json. A
#           failed live trial is data; only `regressed` or an abort is red.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      trials:
        description: Live trials per task. About 8 generateContent calls per trial at HEAD.
        type: number
        default: 1
      chat_model:
        description: >-
          Run the live suite on another chat id, e.g. gemini-flash-latest. A migration
          comparison, not the pinned rate: no tally is pushed. Empty runs the pinned id.
        type: string
        default: ''
      rotation:
        description: >-
          Also run the rotation's prior-auth and red-team slice after the live job, on what
          the day has left (P1-H). Not with chat_model.
        type: boolean
        default: false

permissions:
  contents: read

# Both jobs point at their own service containers.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentdb

jobs:
  # The secrets context cannot be read in a job-level `if`, so the live job
  # cannot skip itself on a missing key. This job reads it for it. The key is
  # compared inside the expression and never enters a process environment, and
  # nothing is checked out, so no pull-request code runs beside it.
  gate:
    name: eval-live-gate
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.probe.outputs.has_key }}
    steps:
      - id: probe
        run: echo "has_key=${{ secrets.GOOGLE_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  replay:
    # The check's context, which P1-D makes a required check by this name.
    name: eval-replay
    needs: gate
    # Never skipped by a condition, because a skipped job satisfies a required
    # check. `!cancelled()` is here so that a failed gate, which would otherwise
    # skip this job, cannot; the summary then says the gate did not report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    # No GOOGLE_API_KEY anywhere in this job, so code from a pull request never
    # has one. The runner's own watcher fails the run if a request reaches the
    # model host regardless.
    env:
      EVAL_CASSETTE_MODE: replay
      EVAL_EXPECT_AXES: model=replay memory=live
      # The verdict, not the pass rate, is the exit code. Accepting a change is
      # `EVAL_CASSETTE_MODE=replay EVAL_GATE=update yarn eval` and a reviewed
      # baseline diff, never a re-run.
      EVAL_GATE: replay

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      # Absolute, because Turbo runs the task in apps/agent-service and a
      # relative path would resolve there.
      - run: echo "EVAL_OUTPUT_DIR=$RUNNER_TEMP/eval-replay" >> "$GITHUB_ENV"

      - run: yarn install --immutable

      - run: yarn eval

      # Prior-auth, after memory-recall and whatever its verdict, into a
      # directory of its own: the runner clears the report files it writes
      # before it starts, so a shared directory would lose the first suite's.
      # The same gate applies, against datasets/prior-auth/baselines/replay.json:
      # a wrongful approval flips a `no_false_approval` cell, which is `regressed`.
      - name: Prior-auth
        if: ${{ !cancelled() }}
        run: EVAL_SUITE=prior-auth EVAL_OUTPUT_DIR="$RUNNER_TEMP/eval-prior-auth" yarn eval

      # The red team, after memory-recall and whatever its verdict, into a
      # directory of its own: the runner clears the report files it writes
      # before it starts, so a shared directory would lose the first suite's.
      # The same gate applies, against datasets/red-team/baselines/replay.json.
      - name: Red team
        if: ${{ !cancelled() }}
        run: EVAL_SUITE=red-team EVAL_OUTPUT_DIR="$RUNNER_TEMP/eval-red-team" yarn eval

      # Three outcomes, told apart by the files rather than the exit code,
      # which Turbo reduces to 1: a report for a completed suite, pass or fail,
      # and an abort summary for a run that did not complete.
      - name: Job summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          HAS_KEY: ${{ needs.gate.outputs.has_key }}
        run: |
          for dir in "$EVAL_OUTPUT_DIR" "$RUNNER_TEMP/eval-prior-auth" "$RUNNER_TEMP/eval-red-team"; do
            if [ -f "$dir/eval-summary.md" ]; then
              cat "$dir/eval-summary.md" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## Eval — did not start ($(basename "$dir"))" >> "$GITHUB_STEP_SUMMARY"
              echo 'No summary was written. See the step that failed before `yarn eval`.' >> "$GITHUB_STEP_SUMMARY"
            fi
            echo >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "$EVENT" != schedule ] && [ "$EVENT" != workflow_dispatch ]; then
            echo "> **Live tier:** not run on \`$EVENT\`. It runs nightly and on dispatch." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_KEY" = false ]; then
            echo '> **Live tier and canary: did not run.** There is no `GOOGLE_API_KEY` repository secret, so the `eval-live`, `eval-compare`, `eval-canary` and `eval-rotation` jobs were skipped. This replay is a frozen sample and cannot catch the model getting worse, the client breaking, or the model behind the pinned id changing.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_KEY" != true ]; then
            echo '> **Live tier: did not run.** The `eval-live-gate` job did not report whether a key exists.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '> **Live tier:** see the `eval-live` job in this run, and `eval-canary` for the model behind the pinned ids.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-replay
          path: ${{ env.EVAL_OUTPUT_DIR }}
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-prior-auth
          path: ${{ runner.temp }}/eval-prior-auth
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-red-team
          path: ${{ runner.temp }}/eval-red-team
          if-no-files-found: warn

  live:
    name: eval-live
    needs: gate
    # Skipped, never passed, when there is no key: a green job that measured
    # nothing is the failure REQUIRE_INTEGRATION_ENV was written to stop. The
    # schedule is paused by EVAL_SCHEDULE_PAUSED `true` or `live`.
    if: >-
      needs.gate.outputs.has_key == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.EVAL_SCHEDULE_PAUSED != 'true' &&
      vars.EVAL_SCHEDULE_PAUSED != 'live'))
    # One run at a time: two overlapping runs on one daily quota make it
    # impossible to tell which of them exhausted it.
    concurrency:
      group: eval-live
      cancel-in-progress: false
    # The one job that writes: it pushes its tally to eval-history. It runs only
    # on schedule and dispatch, from main, and the concurrency group above means
    # two runs never push at once. The ruleset targets the default branch only.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # A `chat_model` dispatch runs on the floating alias, whose free tier has
    # answered single calls in 134-555 s under load (dispatch 40314499494, cut
    # off at 30 minutes with one task done). The pinned nightly takes about 5.
    timeout-minutes: ${{ inputs.chat_model && 90 || 30 }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      # `record` does not change the axis: it is a live run that keeps a copy
      # of its decisions, including any recorded error, which is how a live
      # failure is diagnosed after the fact. Never committed from here.
      EVAL_CASSETTE_MODE: record
      # A present key that still produces the wrong axes fails before any
      # trial, rather than going green on the stub set.
      EVAL_EXPECT_AXES: model=live memory=live
      EVAL_TRIALS: ${{ inputs.trials || '1' }}
      # Empty on the schedule, and on a dispatch that left it empty: the pinned id.
      EVAL_CHAT_MODEL: ${{ inputs.chat_model }}
      # A failed trial is an expected sample here; the pooled verdict decides.
      # Not on another chat id: its tally would pool into the pinned epoch, and
      # the runner refuses EVAL_GATE under an override anyway.
      EVAL_GATE: ${{ !inputs.chat_model && 'live' || '' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - run: |
          echo "EVAL_OUTPUT_DIR=$RUNNER_TEMP/eval-live" >> "$GITHUB_ENV"
          echo "EVAL_HISTORY_DIR=$RUNNER_TEMP/eval-history" >> "$GITHUB_ENV"

      - run: yarn install --immutable

      # The epoch this night pools into is the cassette set committed at HEAD,
      # which the runner reads from the repository, so clearing the files below
      # does not change it. The first nightly creates the orphan branch; every
      # later one appends to it.
      - name: Check out the evaluation history
        if: ${{ !inputs.chat_model }}
        run: |
          yarn turbo build --filter=@repo/agent-service... --output-logs=errors-only
          yarn workspace @repo/agent-service eval:history open

      # So the artifact holds this run's recordings and nothing else.
      # A trial that throws writes no cassette, and a committed file left in
      # its place would be indistinguishable from a fresh one.
      - name: Clear the committed cassettes
        run: rm -f packages/eval-harness/datasets/memory-recall/cassettes/*.json

      # The key is on this step only, not the job: `yarn install` runs package
      # build scripts, and none of them needs it.
      - run: yarn eval
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Job summary
        if: always()
        env:
          CHAT_MODEL: ${{ inputs.chat_model }}
        run: |
          if [ -n "$CHAT_MODEL" ]; then
            echo "> **Migration comparison on \`$CHAT_MODEL\`**, not the pinned rate. No tally was pushed to eval-history." >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$EVAL_OUTPUT_DIR/eval-summary.md" ]; then
            cat "$EVAL_OUTPUT_DIR/eval-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Eval — did not start' >> "$GITHUB_STEP_SUMMARY"
            echo 'No summary was written. See the step that failed before `yarn eval`.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Green is not "passed" when the evidence is short or there is nothing to
      # compare with, so those two verdicts carry a notice.
      - name: Live verdict notice
        if: always()
        run: |
          gate="$EVAL_OUTPUT_DIR/eval-gate.json"
          [ -f "$gate" ] || exit 0
          verdict=$(jq -r .verdict "$gate")
          case "$verdict" in
            insufficient-evidence|incomparable)
              echo "::notice title=Live gate: $verdict::Not a pass. The job summary lists the trials each task still needs." ;;
          esac

      # Even when the verdict is red: a regressed night is evidence too. An
      # aborted run wrote no tally, and this pushes nothing.
      - name: Push the tally to eval-history
        if: ${{ !cancelled() && !inputs.chat_model }}
        run: yarn workspace @repo/agent-service eval:history publish

      # In the same artifact as the reports: the decisions this run made are
      # what P1-E compares against the committed set.
      - name: Keep the recorded cassettes with the reports
        if: always()
        run: |
          mkdir -p "$EVAL_OUTPUT_DIR/cassettes"
          find packages/eval-harness/datasets/memory-recall/cassettes -name '*.json' \
            -exec cp {} "$EVAL_OUTPUT_DIR/cassettes/" \;

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-live
          path: ${{ env.EVAL_OUTPUT_DIR }}
          if-no-files-found: warn

  # The model behind the ids (P1-E). Skipped, never passed, without the key,
  # for the reason the live job is. Only EVAL_SCHEDULE_PAUSED=true pauses its
  # schedule; `live` keeps it.
  canary:
    name: eval-canary
    needs: gate
    if: >-
      needs.gate.outputs.has_key == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.EVAL_SCHEDULE_PAUSED != 'true'))
    # The live job's group: the same daily quota, and two runs on it at once
    # make it impossible to tell which exhausted it.
    concurrency:
      group: eval-live
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No service containers: the canary needs a key and no stores.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - run: echo "CANARY_OUTPUT_DIR=$RUNNER_TEMP/canary" >> "$GITHUB_ENV"

      - run: yarn install --immutable

      # Red on a pinned `changed`, `gone` or `unobserved`. Back to green is
      # `CANARY_BASELINE=update yarn canary` with a key and a committed
      # baseline, never a re-run.
      - run: yarn canary
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Job summary
        if: always()
        run: |
          if [ -f "$CANARY_OUTPUT_DIR/canary-summary.md" ]; then
            cat "$CANARY_OUTPUT_DIR/canary-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Canary — did not start' >> "$GITHUB_STEP_SUMMARY"
            echo 'No summary was written. See the step that failed before `yarn canary`.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # A moved alias is news about the next model and does not fail the run,
      # so it has to be visible some other way than a colour. So is an alias
      # the provider could not serve (`unavailable`), with its 5xx as the text.
      - name: Floating-alias notice
        if: always()
        run: |
          report="$CANARY_OUTPUT_DIR/canary-report.json"
          [ -f "$report" ] || exit 0
          jq -r '.results[] | select(.pinned == false and .verdict != "unchanged") | "\(.id)|\(.verdict)|\(.observed // .detail // "")"' "$report" |
            while IFS='|' read -r id verdict observed; do
              echo "::notice title=Floating alias $verdict::$id is $verdict ($observed). A migration input, not drift."
            done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-canary
          path: ${{ env.CANARY_OUTPUT_DIR }}
          if-no-files-found: warn

  # The night's live decisions against the committed cassettes (P1-E). Reads
  # the eval-live artifact; skipped whenever the live job was.
  compare:
    name: eval-compare
    needs: live
    if: always() && needs.live.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No key in this job: it reads files, and the runner's watcher fails it if
    # a request reaches the model host regardless.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - run: |
          echo "COMPARE_LIVE_DIR=$RUNNER_TEMP/eval-live/cassettes" >> "$GITHUB_ENV"
          echo "COMPARE_OUTPUT_DIR=$RUNNER_TEMP/eval-compare" >> "$GITHUB_ENV"

      - run: yarn install --immutable

      - uses: actions/download-artifact@v8
        with:
          name: eval-live
          path: ${{ runner.temp }}/eval-live

      - run: |
          yarn turbo build --filter=@repo/agent-service... --output-logs=errors-only
          yarn workspace @repo/agent-service canary:compare

      - name: Job summary
        if: always()
        run: |
          if [ -f "$COMPARE_OUTPUT_DIR/compare-summary.md" ]; then
            cat "$COMPARE_OUTPUT_DIR/compare-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Decisions — did not run' >> "$GITHUB_STEP_SUMMARY"
            echo 'No summary was written. See the step that failed.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-compare
          path: ${{ env.COMPARE_OUTPUT_DIR }}
          if-no-files-found: warn

  # Prior-auth and the red team on the live model, a slice a night (P1-H).
  # Last, after the live job and the canary, so it spends what they left and
  # cannot take a call either needed. Skipped whenever the live job was, so
  # EVAL_SCHEDULE_PAUSED `true` and `live` stop it too; `rotation` stops it
  # alone. A dispatch runs it only with `rotation: true` and no `chat_model`.
  rotation:
    name: eval-rotation
    needs: [gate, live, canary]
    if: >-
      !cancelled() && needs.gate.outputs.has_key == 'true' && needs.live.result != 'skipped' &&
      (github.event_name == 'schedule' && vars.EVAL_SCHEDULE_PAUSED != 'rotation' ||
      github.event_name == 'workflow_dispatch' && inputs.rotation && !inputs.chat_model)
    # The live job's group: the same daily quota.
    concurrency:
      group: eval-live
      cancel-in-progress: false
    # It pushes its tallies to eval-history, as the live job does.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    env:
      # L: the free-tier generateContent requests per day for the pinned chat
      # id on the repository secret's project, read from AI Studio's rate-limit
      # view for that project or from a per-day 429's quotaValue, with its
      # source and date in .context/conventions.md, "Live model quota". Not
      # recorded yet. Empty: the job runs nothing and warns; it never falls
      # back to a guessed number.
      EVAL_ROTATION_DAILY_LIMIT: ''
      # As the live job: a live run that keeps a copy of its decisions.
      EVAL_CASSETTE_MODE: record
      EVAL_EXPECT_AXES: model=live memory=live
      # The slice is costed at one trial a task.
      EVAL_TRIALS: '1'
      # The pooled verdict decides, plus the zero-tolerance graders: one live
      # failure of no_false_approval or a canary_absent grader is red.
      EVAL_GATE: live

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - run: |
          {
            echo "EVAL_HISTORY_DIR=$RUNNER_TEMP/eval-history"
            echo "ROTATION_LIVE_DIR=$RUNNER_TEMP/eval-live"
            echo "ROTATION_OUTPUT_DIR=$RUNNER_TEMP/eval-rotation"
          } >> "$GITHUB_ENV"

      - run: yarn install --immutable

      # What the live job spent is in its report. Without the artifact the
      # budget step falls back to memory-recall's modelCalls ceilings.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: eval-live
          path: ${{ runner.temp }}/eval-live

      - name: Check out the evaluation history
        run: |
          yarn turbo build --filter=@repo/agent-service... --output-logs=errors-only
          yarn workspace @repo/agent-service eval:history open

      # budget = L − S − R, then the least-covered tasks that fit it. Writes
      # rotation-summary.md and the outputs below; with L empty, an empty slice.
      - name: Choose tonight's slice
        id: slice
        env:
          ROTATION_CANARY_RESULT: ${{ needs.canary.result }}
          ROTATION_LIVE_TRIALS: ${{ inputs.trials || '1' }}
        run: yarn workspace @repo/agent-service eval:history slice

      # As the live job does for memory-recall: so the artifact holds tonight's
      # recordings and nothing else. The epoch is read from git, not from disk.
      - name: Clear the selected suites' committed cassettes
        if: ${{ steps.slice.outputs.run == 'true' }}
        env:
          PRIOR_AUTH: ${{ steps.slice.outputs.prior_auth }}
          RED_TEAM: ${{ steps.slice.outputs.red_team }}
        run: |
          if [ -n "$PRIOR_AUTH" ]; then rm -f packages/eval-harness/datasets/prior-auth/cassettes/*.json; fi
          if [ -n "$RED_TEAM" ]; then rm -f packages/eval-harness/datasets/red-team/cassettes/*.json; fi

      # The key is on the two runs only, as in the live job.
      - name: Prior-auth slice
        if: ${{ steps.slice.outputs.prior_auth != '' }}
        env:
          EVAL_SUITE: prior-auth
          EVAL_TASKS: ${{ steps.slice.outputs.prior_auth }}
          EVAL_OUTPUT_DIR: ${{ runner.temp }}/eval-rotation/prior-auth
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: yarn eval

      # Whatever prior-auth's verdict, except a per-day 429: the day is then
      # spent, and a request here would only be refused.
      - name: Red-team slice
        if: ${{ !cancelled() && steps.slice.outputs.red_team != '' }}
        env:
          EVAL_SUITE: red-team
          EVAL_TASKS: ${{ steps.slice.outputs.red_team }}
          EVAL_OUTPUT_DIR: ${{ runner.temp }}/eval-rotation/red-team
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          abort="$ROTATION_OUTPUT_DIR/prior-auth/eval-abort.json"
          if [ -f "$abort" ] && [ "$(jq -r '.cause.code // ""' "$abort")" = daily-quota ]; then
            echo '::error title=Rotation::The prior-auth slice aborted on the per-day quota, so the red-team slice did not run.'
            exit 1
          fi
          yarn eval

      # Even when a verdict is red. An aborted suite wrote no tally.
      - name: Push the tallies to eval-history
        if: ${{ !cancelled() && steps.slice.outputs.run == 'true' }}
        run: yarn workspace @repo/agent-service eval:history publish

      # Tonight's recordings go with the reports, and the committed set comes
      # back for the comparison below.
      - name: Keep the recorded cassettes with the reports
        if: ${{ always() && steps.slice.outputs.run == 'true' }}
        run: |
          for suite in prior-auth red-team; do
            dir="$ROTATION_OUTPUT_DIR/$suite"
            [ -d "$dir" ] || continue
            mkdir -p "$dir/cassettes"
            find "packages/eval-harness/datasets/$suite/cassettes" -name '*.json' \
              -exec cp {} "$dir/cassettes/" \;
            git checkout HEAD -- "packages/eval-harness/datasets/$suite/cassettes"
          done

      # P1-E's comparison, per suite, at no model cost. Informational: it does
      # not change this job's colour.
      - name: Decisions against the committed cassettes
        if: ${{ always() && steps.slice.outputs.run == 'true' }}
        run: |
          for suite in prior-auth red-team; do
            live="$ROTATION_OUTPUT_DIR/$suite/cassettes"
            [ -d "$live" ] || continue
            COMPARE_SUITE="$suite" COMPARE_LIVE_DIR="$live" \
              COMPARE_OUTPUT_DIR="$ROTATION_OUTPUT_DIR/$suite/compare" \
              yarn workspace @repo/agent-service canary:compare ||
              echo "::notice title=Rotation decisions ($suite)::canary:compare exited non-zero; see its summary."
          done

      - name: Job summary
        if: always()
        env:
          BUDGET: ${{ steps.slice.outputs.budget }}
        run: |
          if [ -f "$ROTATION_OUTPUT_DIR/rotation-summary.md" ]; then
            cat "$ROTATION_OUTPUT_DIR/rotation-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Rotation — did not start' >> "$GITHUB_STEP_SUMMARY"
            echo 'No summary was written. See the step that failed before the slice was chosen.' >> "$GITHUB_STEP_SUMMARY"
          fi
          made=''
          for suite in prior-auth red-team; do
            dir="$ROTATION_OUTPUT_DIR/$suite"
            [ -d "$dir" ] || continue
            if [ -f "$dir/eval-report.json" ] && [ ! -f "$dir/eval-abort.json" ]; then
              made="$made $suite $(jq '[.usage.trials[].modelCalls] | add // 0' "$dir/eval-report.json"),"
            else
              made="$made $suite unknown (it did not complete),"
            fi
          done
          if [ -n "$made" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "**Calls the slice made:**${made%,}; the budget was $BUDGET, plus at most R = 1." >> "$GITHUB_STEP_SUMMARY"
          fi
          for suite in prior-auth red-team; do
            for file in "$ROTATION_OUTPUT_DIR/$suite/eval-summary.md" "$ROTATION_OUTPUT_DIR/$suite/compare/compare-summary.md"; do
              [ -f "$file" ] || continue
              echo >> "$GITHUB_STEP_SUMMARY"
              cat "$file" >> "$GITHUB_STEP_SUMMARY"
            done
          done

      # A night that measured nothing is green with a warning, never a pass;
      # a short or unreferenced pool carries the live job's notice.
      - name: Rotation notices
        if: always()
        env:
          RUN: ${{ steps.slice.outputs.run }}
        run: |
          summary="$ROTATION_OUTPUT_DIR/rotation-summary.md"
          if [ "$RUN" = false ] && [ -f "$summary" ]; then
            echo "::warning title=Rotation not run::$(head -n 1 "$summary" | sed 's/^## //')"
          fi
          for suite in prior-auth red-team; do
            gate="$ROTATION_OUTPUT_DIR/$suite/eval-gate.json"
            [ -f "$gate" ] || continue
            verdict=$(jq -r .verdict "$gate")
            case "$verdict" in
              insufficient-evidence|incomparable)
                echo "::notice title=Rotation $suite: $verdict::Not a pass. The job summary lists the trials each task still needs." ;;
            esac
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-rotation
          path: ${{ env.ROTATION_OUTPUT_DIR }}
          if-no-files-found: warn
