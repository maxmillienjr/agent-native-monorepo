name: Agent Eval

# Two tiers of the same suite (P1-C, ADR 0005).
#
#   replay  every pull request, every push to main, and nightly. The model's
#           decisions come from the committed cassettes, so it makes no model
#           call and needs no key; the memory axis is live, against the two
#           service containers. A failed trial here means something changed.
#   live    nightly and on dispatch, only when a GOOGLE_API_KEY repository
#           secret exists. It catches what replay cannot: the model getting
#           worse and the client breaking. About eight generateContent calls
#           per trial, against a daily free tier of twenty.
#
# What goes red is the regression gate's verdict (P1-D), not "a trial failed":
#
#   replay  EVAL_GATE=replay compares every (task, trial, grader) cell with the
#           committed baselines/replay.json. Any difference blocks, an
#           improvement included, and so does an aborted run. `eval-replay` is
#           the check .github/rulesets/main.json makes required.
#   live    EVAL_GATE=live appends the night's tally to the orphan eval-history
#           branch and compares the pooled epoch with baselines/live.json. A
#           failed live trial is data; only `regressed` or an abort is red.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      trials:
        description: Live trials per task. About 8 generateContent calls per trial at HEAD.
        type: number
        default: 1

permissions:
  contents: read

# Both jobs point at their own service containers.
env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentdb
  NEO4J_URI: bolt://localhost:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: password

jobs:
  # The secrets context cannot be read in a job-level `if`, so the live job
  # cannot skip itself on a missing key. This job reads it for it. The key is
  # compared inside the expression and never enters a process environment, and
  # nothing is checked out, so no pull-request code runs beside it.
  gate:
    name: eval-live-gate
    runs-on: ubuntu-latest
    outputs:
      has_key: ${{ steps.probe.outputs.has_key }}
    steps:
      - id: probe
        run: echo "has_key=${{ secrets.GOOGLE_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  replay:
    # The check's context, which P1-D makes a required check by this name.
    name: eval-replay
    needs: gate
    # Never skipped by a condition, because a skipped job satisfies a required
    # check. `!cancelled()` is here so that a failed gate, which would otherwise
    # skip this job, cannot; the summary then says the gate did not report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 5s
          --health-retries 30
    # No GOOGLE_API_KEY anywhere in this job, so code from a pull request never
    # has one. The runner's own watcher fails the run if a request reaches the
    # model host regardless.
    env:
      EVAL_CASSETTE_MODE: replay
      EVAL_EXPECT_AXES: model=replay memory=live
      # The verdict, not the pass rate, is the exit code. Accepting a change is
      # `EVAL_CASSETTE_MODE=replay EVAL_GATE=update yarn eval` and a reviewed
      # baseline diff, never a re-run.
      EVAL_GATE: replay

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      # Absolute, because Turbo runs the task in apps/agent-service and a
      # relative path would resolve there.
      - run: echo "EVAL_OUTPUT_DIR=$RUNNER_TEMP/eval-replay" >> "$GITHUB_ENV"

      - run: yarn install --immutable

      - run: yarn eval

      # Three outcomes, told apart by the files rather than the exit code,
      # which Turbo reduces to 1: a report for a completed suite, pass or fail,
      # and an abort summary for a run that did not complete.
      - name: Job summary
        if: always()
        env:
          EVENT: ${{ github.event_name }}
          HAS_KEY: ${{ needs.gate.outputs.has_key }}
        run: |
          if [ -f "$EVAL_OUTPUT_DIR/eval-summary.md" ]; then
            cat "$EVAL_OUTPUT_DIR/eval-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Eval — did not start' >> "$GITHUB_STEP_SUMMARY"
            echo 'No summary was written. See the step that failed before `yarn eval`.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT" != schedule ] && [ "$EVENT" != workflow_dispatch ]; then
            echo "> **Live tier:** not run on \`$EVENT\`. It runs nightly and on dispatch." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_KEY" = false ]; then
            echo '> **Live tier: did not run.** There is no `GOOGLE_API_KEY` repository secret, so the `eval-live` job was skipped. This replay is a frozen sample and cannot catch the model getting worse or the client breaking.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_KEY" != true ]; then
            echo '> **Live tier: did not run.** The `eval-live-gate` job did not report whether a key exists.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '> **Live tier:** see the `eval-live` job in this run.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-replay
          path: ${{ env.EVAL_OUTPUT_DIR }}
          if-no-files-found: warn

  live:
    name: eval-live
    needs: gate
    # Skipped, never passed, when there is no key: a green job that measured
    # nothing is the failure REQUIRE_INTEGRATION_ENV was written to stop.
    if: >-
      needs.gate.outputs.has_key == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    # One run at a time: two overlapping runs on one daily quota make it
    # impossible to tell which of them exhausted it.
    concurrency:
      group: eval-live
      cancel-in-progress: false
    # The one job that writes: it pushes its tally to eval-history. It runs only
    # on schedule and dispatch, from main, and the concurrency group above means
    # two runs never push at once. The ruleset targets the default branch only.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        ports: ['7687:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1'"
          --health-interval 5s
          --health-retries 30
    env:
      # `record` does not change the axis: it is a live run that keeps a copy
      # of its decisions, including any recorded error, which is how a live
      # failure is diagnosed after the fact. Never committed from here.
      EVAL_CASSETTE_MODE: record
      # A present key that still produces the wrong axes fails before any
      # trial, rather than going green on the stub set.
      EVAL_EXPECT_AXES: model=live memory=live
      EVAL_TRIALS: ${{ inputs.trials || '1' }}
      # A failed trial is an expected sample here; the pooled verdict decides.
      EVAL_GATE: live

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - run: |
          echo "EVAL_OUTPUT_DIR=$RUNNER_TEMP/eval-live" >> "$GITHUB_ENV"
          echo "EVAL_HISTORY_DIR=$RUNNER_TEMP/eval-history" >> "$GITHUB_ENV"

      - run: yarn install --immutable

      # The epoch this night pools into is the cassette set committed at HEAD,
      # which the runner reads from the repository, so clearing the files below
      # does not change it. The first nightly creates the orphan branch; every
      # later one appends to it.
      - name: Check out the evaluation history
        run: |
          yarn turbo build --filter=@repo/agent-service... --output-logs=errors-only
          yarn workspace @repo/agent-service eval:history open

      # So the artifact holds this run's recordings and nothing else.
      # A trial that throws writes no cassette, and a committed file left in
      # its place would be indistinguishable from a fresh one.
      - name: Clear the committed cassettes
        run: rm -f packages/eval-harness/datasets/memory-recall/cassettes/*.json

      # The key is on this step only, not the job: `yarn install` runs package
      # build scripts, and none of them needs it.
      - run: yarn eval
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Job summary
        if: always()
        run: |
          if [ -f "$EVAL_OUTPUT_DIR/eval-summary.md" ]; then
            cat "$EVAL_OUTPUT_DIR/eval-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Eval — did not start' >> "$GITHUB_STEP_SUMMARY"
            echo 'No summary was written. See the step that failed before `yarn eval`.' >> "$GITHUB_STEP_SUMMARY"
          fi

      # Green is not "passed" when the evidence is short or there is nothing to
      # compare with, so those two verdicts carry a notice.
      - name: Live verdict notice
        if: always()
        run: |
          gate="$EVAL_OUTPUT_DIR/eval-gate.json"
          [ -f "$gate" ] || exit 0
          verdict=$(jq -r .verdict "$gate")
          case "$verdict" in
            insufficient-evidence|incomparable)
              echo "::notice title=Live gate: $verdict::Not a pass. The job summary lists the trials each task still needs." ;;
          esac

      # Even when the verdict is red: a regressed night is evidence too. An
      # aborted run wrote no tally, and this pushes nothing.
      - name: Push the tally to eval-history
        if: ${{ !cancelled() }}
        run: yarn workspace @repo/agent-service eval:history publish

      # In the same artifact as the reports: the decisions this run made are
      # what P1-E compares against the committed set.
      - name: Keep the recorded cassettes with the reports
        if: always()
        run: |
          mkdir -p "$EVAL_OUTPUT_DIR/cassettes"
          find packages/eval-harness/datasets/memory-recall/cassettes -name '*.json' \
            -exec cp {} "$EVAL_OUTPUT_DIR/cassettes/" \;

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-live
          path: ${{ env.EVAL_OUTPUT_DIR }}
          if-no-files-found: warn
