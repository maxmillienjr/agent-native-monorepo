name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentdb
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/password
        ports: ['7687:7687']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn turbo build

      # REQUIRE_INTEGRATION_ENV turns a missing store variable into a failure
      # rather than 27 skipped tests and exit 0. It used to be set only by
      # memory-core's nightly alias of this script, which ran these same five files.
      - run: yarn turbo test:integration
        env:
          REQUIRE_INTEGRATION_ENV: '1'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agentdb
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password

  browser-e2e:
    name: Playwright against the full compose stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - run: yarn install --immutable

      # The suite used to boot only the Vite dev server, so its assertions passed
      # against a page with no backend behind it. Here the console container serves
      # the production bundle and proxies /api to the gateway, which is the path a
      # reader actually exercises.
      - name: Start the full stack
        run: docker compose --profile full up -d --build --wait --wait-timeout 300

      - run: yarn playwright install --with-deps chromium
        working-directory: apps/console

      - run: yarn turbo test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080

      - name: Dump container logs on failure
        if: failure()
        run: docker compose --profile full logs --no-color

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/console/playwright-report/
          retention-days: 7

      - name: Tear down
        if: always()
        run: docker compose --profile full down -v
