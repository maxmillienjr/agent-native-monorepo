name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn format:check
      - run: yarn lint:docs
      - run: yarn turbo lint
      - run: yarn turbo typecheck
      - run: yarn turbo test:unit
      - run: yarn turbo test:service
      - run: yarn turbo build

  # The four gates above never build a container, so an image that cannot install
  # its own workspaces passes CI and fails in Release, on the deploy path, after
  # main is already green. That is how @repo/eval-harness shipped broken. Building
  # here without pushing moves the failure back to the gate.
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [agent-service, gateway, console]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: ${{ matrix.app }}:ci
          # Only agent-service reads it; the others ignore an unused argument.
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # P3-B: the image names its commit, and the replay command is in it. With
      # no DATABASE_URL the command must refuse with exit 2 after starting, which
      # proves it resolves its imports inside the image without a database.
      - name: The image carries its commit and the replay command
        if: matrix.app == 'agent-service'
        run: |
          sha="$(docker run --rm agent-service:ci node -e 'process.stdout.write(process.env.GIT_SHA ?? "")')"
          if [ "$sha" != "${{ github.sha }}" ]; then
            echo "::error::GIT_SHA in the image is '$sha', expected ${{ github.sha }}"
            exit 1
          fi
          set +e
          out="$(docker run --rm agent-service:ci node dist/audit/replay.js 00000000-0000-4000-8000-000000000000 2>&1)"
          code=$?
          set -e
          echo "$out"
          if [ "$code" != "2" ] || ! echo "$out" | grep -q 'needs DATABASE_URL'; then
            echo "::error::dist/audit/replay.js did not run inside the image (exit $code)"
            exit 1
          fi

      # console is not probed standalone: its nginx.conf proxies to the `gateway`
      # upstream, which only resolves on the compose network, so a bare `docker run`
      # exits on purpose. e2e.yml is what exercises it running.
      - name: The image starts and resolves its workspace imports
        if: matrix.app != 'console'
        run: |
          docker run -d --name probe ${{ matrix.app }}:ci
          sleep 8
          docker logs probe
          if [ "$(docker inspect -f '{{.State.Running}}' probe)" != "true" ]; then
            echo "::error::${{ matrix.app }} image exited instead of staying up"
            exit 1
          fi
          if docker logs probe 2>&1 | grep -qi 'cannot find package'; then
            echo "::error::a workspace import resolved to nothing in the built image"
            exit 1
          fi
