  - id: CTL-COST-01
    title: A trial is bounded in input tokens, output tokens and model calls, asserted in CI
    status: implemented
    maps:
      - { framework: owasp-llm-2025, ref: 'LLM10:2025' }
    evidence:
      - { kind: symbol, file: packages/eval-harness/src/budgets.ts, name: checkBudgets }
      - kind: test
        file: packages/eval-harness/src/harness.test.ts
        name: keeps a correct trial that spent too much passed, and counts the breach beside the rate
        tier: unit
      - kind: test
        file: apps/agent-service/src/eval/run-suite.test.ts
        name: ends failed on a budget breach although every trial passed
        tier: unit
      - { kind: ci, workflow: agent-eval.yml, job: replay, run: yarn eval }
    note: Delivered by P1-F. Each task file sets per-trial ceilings, checked against the trial's own inference spans beside the graders, so a breach fails the run without moving the pass rate. On the replay job a budget checks the committed cassettes, so it fails on a re-recording that costs more and on nothing else; the nightly live job checks a fresh sample once a repository secret exists. Latency and an estimated dollar cost are reported and not asserted. A latency budget is rejected outright; a dollar assertion waits for two model ids with different prices, which P1-E compares. modelCalls counts operations, not HTTP requests, so a client's own retries inside one call are bounded by P1-C's 429 classifier, not here.

  - id: CTL-ACC-01
    title: Access to the service is authenticated, authorized and encrypted in transit
    status: planned
    owner: P5-A
    maps:
      - { framework: hipaa-164.312, ref: (a)(1) }
      - { framework: hipaa-164.312, ref: (d) }
      - { framework: hipaa-164.312, ref: (e)(1) }
      - { framework: owasp-asi-2026, ref: ASI03 }
    evidence:
      - { kind: symbol, file: apps/gateway/src/server.ts, name: app }
    note: Nothing authenticates a caller today — the gateway mounts JSON parsing, a correlation id and the proxy, and nothing else. P5-A's A2A server declares an authentication scheme in its Agent Card and covers the service's external surface. P5-A cannot close "encrypted in transit", so its implementation splits this row. Authentication stays CTL-ACC-01, per-caller authorization becomes CTL-ACC-02, and transport encryption becomes a not-applicable CTL-ACC-03. The §164.312 mappings describe the safeguard's shape; the repository holds no ePHI (ADR 0003).
