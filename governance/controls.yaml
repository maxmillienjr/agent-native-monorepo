      - { framework: iso-iec-42001-2023, ref: A.6.2.8 }
    evidence:
      - { kind: symbol, file: packages/decision-ledger/src/ledger.ts, name: Ledger.append }
      - { kind: symbol, file: packages/decision-ledger/src/verify.ts, name: verifyChain }
      - { kind: symbol, file: apps/agent-service/src/ledger/verify-ledger.ts, name: verifyLedger }
      - kind: test
        file: packages/decision-ledger/test/ledger.integration.test.ts
        name: denies ledger_writer UPDATE, DELETE and TRUNCATE on ledger_entries
        tier: integration
      - kind: test
