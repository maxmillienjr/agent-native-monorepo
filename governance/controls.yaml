# The control catalogue: which safeguards this repository has, which framework clauses
# each one answers, and what backs it. `yarn lint:docs` validates it and resolves every
# evidence anchor by name; `yarn controls:matrix` renders governance/CONTROLS.md from it.
#
# Anchors name a declaration, a test title, a workflow job or a heading. A `file:NN` line
# anchor is rejected: lines move, and a line check stays green after they do.
#
# A framework's `clauses` holds only the clauses a control maps, with their text copied
# from the source. A new edition of a framework is a new registry id, never an edit to an
# existing one, so a control's mapping is not rewritten under it.
#
# See .context/workflows.md, "Add or change a control".

frameworks:
  nist-ai-rmf-1.0:
    title: NIST AI 100-1, Artificial Intelligence Risk Management Framework (AI RMF 1.0)
    short: AI RMF
    published: '2023-01'
    url: https://doi.org/10.6028/NIST.AI.100-1
    size: 72
    unit: subcategories
    source:
      kind: primary
      note: Subcategory text copied from Tables 1–4 of the NIST PDF (GOVERN 19, MAP 18, MEASURE 22, MANAGE 13).
    clauses:
      GOVERN 1.4: The risk management process and its outcomes are established through transparent policies, procedures, and other controls based on organizational risk priorities.
      GOVERN 3.2: Policies and procedures are in place to define and differentiate roles and responsibilities for human-AI configurations and oversight of AI systems.
      GOVERN 4.3: Organizational practices are in place to enable AI testing, identification of incidents, and information sharing.
      MAP 3.5: Processes for human oversight are defined, assessed, and documented in accordance with organizational policies from the GOVERN function.
      MAP 4.1: Approaches for mapping AI technology and legal risks of its components – including the use of third-party data or software – are in place, followed, and documented, as are risks of infringement of a third party's intellectual property or other rights.
      MEASURE 1.1: Approaches and metrics for measurement of AI risks enumerated during the MAP function are selected for implementation starting with the most significant AI risks. The risks or trustworthiness characteristics that will not – or cannot – be measured are properly documented.
      MEASURE 2.3: AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment setting(s). Measures are documented.
      MEASURE 2.4: The functionality and behavior of the AI system and its components – as identified in the MAP function – are monitored when in production.
      MEASURE 2.5: The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability beyond the conditions under which the technology was developed are documented.
      MEASURE 2.6: The AI system is evaluated regularly for safety risks – as identified in the MAP function. The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed the risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits. Safety metrics reflect system reliability and robustness, real-time monitoring, and response times for AI system failures.
      MEASURE 2.7: AI system security and resilience – as identified in the MAP function – are evaluated and documented.
      MEASURE 2.10: Privacy risk of the AI system – as identified in the MAP function – is examined and documented.
      MANAGE 1.1: A determination is made as to whether the AI system achieves its intended purposes and stated objectives and whether its development or deployment should proceed.
      MANAGE 3.1: AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented.
      MANAGE 4.1: Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors, appeal and override, decommissioning, incident response, recovery, and change management.

  nist-ai-600-1:
    title: NIST AI 600-1, Artificial Intelligence Risk Management Framework — Generative Artificial Intelligence Profile
    short: AI 600-1
    published: '2024-07'
    url: https://doi.org/10.6028/NIST.AI.600-1
    size: 213
    unit: suggested actions
    source:
      kind: primary
      note: Action text copied from the NIST PDF. The 213 is a count of unique GV-/MP-/MS-/MG-n.n-nnn ids in the PDF (GV 59, MP 39, MS 72, MG 43), including GV-4.3-001, which the PDF prints as "GV4.3--001".
    clauses:
      MS-2.5-001: Avoid extrapolating GAI system performance or capabilities from narrow, non-systematic, and anecdotal assessments.
      MS-2.7-001: 'Apply established security measures to: Assess likelihood and magnitude of vulnerabilities and threats such as backdoors, compromised dependencies, data breaches, eavesdropping, man-in-the-middle attacks, reverse engineering, autonomous agents, model theft or exposure of model weights, AI inference, bypass, extraction, and other baseline security concerns.'
      MS-2.7-007: 'Perform AI red-teaming to assess resilience against: Abuse to facilitate attacks on other systems (e.g., malicious code generation, enhanced phishing content), GAI attacks (e.g., prompt injection), ML attacks (e.g., adversarial examples/prompts, data poisoning, membership inference, model extraction, sponge examples).'
      MS-2.8-003: Use digital content transparency solutions to enable the documentation of each instance where content is generated, modified, or shared to provide a tamper-proof history of the content, promote transparency, and enable traceability. Robust version control systems can also be applied to track changes across the AI lifecycle over time.

  iso-iec-42001-2023:
    title: ISO/IEC 42001:2023, Information technology — Artificial intelligence — Management system, Annex A
    short: ISO/IEC 42001
    published: '2023-12'
    url: https://www.iso.org/standard/42001
    size: 38
    unit: Annex A controls
    source:
      kind: secondary
      note: 'The ISO/IEC 42001 Annex A identifiers, titles and the count of 38 are taken from secondary sources — ISMS.online, "ISO 42001 Annex A Controls Explained" (https://www.isms.online/iso-42001/annex-a-controls/), and RiskProfs, "ISO 42001 Annex A Controls List: All 38 Controls Explained" (https://riskprofs.com/iso-42001-annex-a-controls-list/), which agree — and were not checked against the standard''s text. A reader with the standard can correct them.'
    clauses:
      A.6.2.4: AI system verification and validation
      A.6.2.5: AI system deployment
      A.6.2.6: AI system operation and monitoring
      A.6.2.7: AI system technical documentation
      A.6.2.8: AI system recording of event logs

  owasp-llm-2025:
    title: OWASP Top 10 for LLM Applications 2025
    short: OWASP
    published: '2024-11'
    url: https://genai.owasp.org/llm-top-10/
    size: 10
    unit: risks
    source:
      kind: primary
      note: Titles and definitions copied from the risk pages under genai.owasp.org/llmrisk/. OWASP's 2026 edition renumbers this list (its LLM06 is Unbounded Consumption), so every ref keeps its :2025 suffix; mapping to the 2026 edition would be a new registry id.
    clauses:
      'LLM02:2025': Sensitive Information Disclosure — "Sensitive information can affect both the LLM and its application context."
      'LLM03:2025': Supply Chain — "LLM supply chains are susceptible to various vulnerabilities, which can affect the integrity of training data, models, and deployment platforms."
      'LLM04:2025': Data and Model Poisoning — "Data poisoning occurs when pre-training, fine-tuning, or embedding data is manipulated to introduce vulnerabilities, backdoors, or biases."
      'LLM05:2025': Improper Output Handling — "insufficient validation, sanitization, and handling of the outputs generated by large language models before they are passed downstream to other components and systems."
      'LLM06:2025': Excessive Agency — "the vulnerability that enables damaging actions to be performed in response to unexpected, ambiguous or manipulated outputs from an LLM, regardless of what is causing the LLM to malfunction."
      'LLM08:2025': Vector and Embedding Weaknesses — "Vectors and embeddings vulnerabilities present significant security risks in systems utilizing Retrieval Augmented Generation (RAG) with Large Language Models (LLMs)."
      'LLM10:2025': Unbounded Consumption — "occurs when a Large Language Model (LLM) application allows users to conduct excessive and uncontrolled inferences, leading to risks such as denial of service (DoS), economic losses, model theft, and service degradation."

  owasp-asi-2026:
    title: OWASP Top 10 for Agentic Applications for 2026
    short: OWASP
    published: '2025-12'
    url: https://genai.owasp.org/resource/owasp-top-10-for-agentic-applications-for-2026/
    size: 10
    unit: risks
    source:
      kind: primary
      note: Titles copied from the table of contents of the OWASP PDF, version 2026, dated December 2025. Several secondary write-ups print different titles for ASI03, ASI04 and ASI08; these are the PDF's.
    clauses:
      ASI02: Tool Misuse and Exploitation
      ASI03: Identity and Privilege Abuse
      ASI04: Agentic Supply Chain Vulnerabilities
      ASI06: Memory & Context Poisoning
      ASI08: Cascading Failures
      ASI09: Human-Agent Trust Exploitation

  hipaa-164.312:
    title: 45 CFR §164.312, Technical safeguards (HIPAA Security Rule)
    short: §164.312
    published: '2026-09-24'
    url: https://www.ecfr.gov/current/title-45/subtitle-A/subchapter-C/part-164/subpart-C/section-164.312
    size: 12
    unit: standards and implementation specifications
    source:
      kind: primary
      note: Text copied from the eCFR as in force on 2026-09-24, the date given as its edition. The 12 are the five standards and seven implementation specifications of §164.312. The January 2025 NPRM (90 FR 898) is not final and is not mapped.
    clauses:
      (a)(1): Standard, Access control — "Implement technical policies and procedures for electronic information systems that maintain electronic protected health information to allow access only to those persons or software programs that have been granted access rights as specified in § 164.308(a)(4)."
      (b): Standard, Audit controls — "Implement hardware, software, and/or procedural mechanisms that record and examine activity in information systems that contain or use electronic protected health information."
      (c)(1): Standard, Integrity — "Implement policies and procedures to protect electronic protected health information from improper alteration or destruction."
      (c)(2): Implementation specification, Mechanism to authenticate electronic protected health information (Addressable) — "Implement electronic mechanisms to corroborate that electronic protected health information has not been altered or destroyed in an unauthorized manner."
      (d): Standard, Person or entity authentication — "Implement procedures to verify that a person or entity seeking access to electronic protected health information is the one claimed."
      (e)(1): Standard, Transmission security — "Implement technical security measures to guard against unauthorized access to electronic protected health information that is being transmitted over an electronic communications network."

controls:
  - id: CTL-EVAL-01
    title: Agent capability and reliability are measured over repeated trials (pass@k, pass^k)
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.3 }
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.5 }
      - { framework: nist-ai-600-1, ref: MS-2.5-001 }
      - { framework: iso-iec-42001-2023, ref: A.6.2.4 }
    evidence:
      - { kind: symbol, file: packages/eval-harness/src/harness.ts, name: EvalHarness }
      - kind: test
        file: packages/eval-harness/src/harness.test.ts
        name: reports pass@k as capability and pass^k as reliability
        tier: unit

  - id: CTL-EVAL-02
    title: A task the run's axes cannot measure is excluded and named beside the rate
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 1.1 }
      - { framework: iso-iec-42001-2023, ref: A.6.2.4 }
    evidence:
      - { kind: symbol, file: packages/eval-harness/src/axes.ts, name: skippedTasks }
      - kind: test
        file: packages/eval-harness/src/harness.test.ts
        name: computes passRate over the tasks that ran, and says which did not
        tier: unit

  - id: CTL-EVAL-03
    title: Agent evaluation runs on every pull request, and any change in a grader result fails its job
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: MANAGE 1.1 }
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.3 }
      - { framework: iso-iec-42001-2023, ref: A.6.2.5 }
    evidence:
      - { kind: ci, workflow: agent-eval.yml, job: replay, run: yarn eval }
      - kind: test
        file: packages/eval-harness/src/gate/compare-replay.test.ts
        name: names every cell of a task that stopped running, and a deleted assertion, as missing
        tier: unit
    note: Delivered by P1-C, and gated by P1-D. This is the replay axis, which grades a recorded sample rather than the live model. The job's exit is the regression gate's verdict against the committed baselines/replay.json, so a skipped task, a deleted assertion or a moved score fails it and a failure accepted in the baseline does not. The live job runs nightly and on dispatch, and is skipped until a GOOGLE_API_KEY repository secret exists. A red job blocks a merge only once the owner applies .github/rulesets/main.json.

  - id: CTL-EVAL-04
    title: Each retrieval store's contribution is measured against labels and a decision rule fixed before the run
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.3 }
      - { framework: nist-ai-rmf-1.0, ref: MANAGE 1.1 }
      - { framework: iso-iec-42001-2023, ref: A.6.2.4 }
    evidence:
      - kind: symbol
        file: apps/agent-service/src/eval/run-retrieval-ablation.ts
        name: runConditions
      - {
          kind: symbol,
          file: packages/eval-harness/src/retrieval/evaluate.ts,
          name: applyDecisionRule,
        }
      - kind: test
        file: packages/eval-harness/src/retrieval/dataset.test.ts
        name: holds 200 queries, 50 per stratum, fixed before the first run
        tier: unit
      - kind: test
        file: packages/eval-harness/src/retrieval/evaluate.test.ts
        name: maps each pair of outcomes onto a row of the PRD table
        tier: unit
      - {
          kind: symbol,
          file: packages/eval-harness/src/retrieval/explanation.ts,
          name: applyExplanationRule,
        }
      - kind: test
        file: packages/eval-harness/src/retrieval/explanation-labels.test.ts
        name: load, validate, and equal the derivation from the dataset
        tier: unit
      - {
          kind: doc,
          file: docs/adr/0009-the-second-store-after-the-retrieval-ablation.md,
          heading: The measurement,
        }
    note: Delivered by P2-B. The unit tests hold the dataset to its pre-registered shape and the rule to the PRD's outcome table; they do not re-run the ablation. yarn eval:retrieval runs in no CI pipeline, because P2-B left the tier to P1-C and P1-C shipped first, so a change to a reader is not re-measured until someone runs it. The result it recorded is that the graph does not earn its place in retrieval, and ADR 0009, accepted, took the graph out of the read path. The ablation now measures that retired design as history. P2-D measured the graph's remaining role, explanation, the same way, with gold paths committed before the explainer, a rule fixed before the run, and yarn eval:explanation applying it. Stage 1 is good and stage 2, which costs model calls, decides (ADR 0012). P2-D wired neither command into CI. Under keep P2-E adds a reproduction step for both, and under removal it archives both.

  - id: CTL-EVAL-05
    title: A change to the model behind a pinned model id, or its retirement, turns a scheduled job red
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.4 }
      - { framework: nist-ai-rmf-1.0, ref: MANAGE 3.1 }
    evidence:
      - { kind: ci, workflow: agent-eval.yml, job: canary, run: yarn canary }
      - kind: test
        file: apps/agent-service/src/eval/canary/runner.test.ts
        name: 'chat, pinned: a changed modelVersion exits 1'
        tier: unit
      - kind: test
        file: apps/agent-service/src/eval/canary/probes.test.ts
        name: reports one differing component of one vector as changed, with its cosine
        tier: unit
    note: Delivered by P1-E. `yarn canary` reads models.get for the two pinned ids and the floating alias, modelVersion from one direct generateContent call per chat id, and 21 embeddings compared bit for bit with the vectors the committed cassettes recorded. A pinned changed, gone or unobserved exits 1, and the way back to green is a committed baseline update. The eval-canary job runs it nightly and on dispatch under the GOOGLE_API_KEY repository secret, added 2026-10-08, and is skipped where the secret is absent, as on a fork. Until its first scheduled run the live evidence is one local run of the metadata and embedding probes on 2026-10-08, and the chat baseline is empty, so that first run is red on the pinned chat probe until its modelVersion is committed.

  - id: CTL-OUT-01
    title: Model output is schema-validated before it can reach memory
    status: implemented
    maps:
      - { framework: owasp-llm-2025, ref: 'LLM05:2025' }
      - { framework: owasp-asi-2026, ref: ASI06 }
    evidence:
      - {
          kind: symbol,
          file: apps/agent-service/src/agent/model/extraction.ts,
          name: parseExtraction,
        }
      - kind: test
        file: apps/agent-service/src/agent/model/extraction.test.ts
        name: throws when the JSON parses but does not match the schema
        tier: unit

  - id: CTL-SEC-01
    title: Committed model recordings carry no credential
    status: implemented
    maps:
      - { framework: owasp-llm-2025, ref: 'LLM02:2025' }
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.7 }
    evidence:
      - { kind: symbol, file: packages/agent-cassette/src/redact.ts, name: redactString }
      - kind: test
        file: packages/agent-cassette/src/cassette-secrets.test.ts
        name: carries no Google API key
        tier: unit
    note: The test covers one credential format, the Google API key, which is the only one the recording path handles.

  - id: CTL-SUP-01
    title: A high or critical dependency advisory fails the pull request, and is re-checked weekly
    status: implemented
    maps:
      - { framework: owasp-llm-2025, ref: 'LLM03:2025' }
      - { framework: owasp-asi-2026, ref: ASI04 }
      - { framework: nist-ai-600-1, ref: MS-2.7-001 }
      - { framework: nist-ai-rmf-1.0, ref: MANAGE 3.1 }
    evidence:
      - { kind: ci, workflow: security.yml, job: dependency-audit, run: yarn npm audit }
    note: The audit runs at --severity high, so a moderate advisory does not fail it. Neither does an advisory ID listed in npmAuditIgnoreAdvisories in .yarnrc.yml, which is kept for advisories with no fixed release, each with its reason and removal condition beside it.

  - id: CTL-RES-01
    title: A failing I/O node is retried under a bound; a client error is not; a run fails whole
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.6 }
      - { framework: owasp-asi-2026, ref: ASI08 }
    evidence:
      - { kind: symbol, file: apps/agent-service/src/agent/graph/retry.ts, name: IO_RETRY }
      - kind: test
        file: apps/agent-service/src/agent/graph/graph.test.ts
        name: retries an I/O node that fails twice and succeeds on the third attempt
        tier: unit
      - kind: test
        file: apps/agent-service/src/agent/graph/graph.test.ts
        name: does not retry a client error
        tier: unit
      - kind: test
        file: apps/agent-service/test/runs.e2e-spec.ts
        name: emits a terminal error frame and closes the stream
        tier: service

  - id: CTL-LOG-01
    title: Graph nodes and store operations are traced as nested spans
    status: implemented
    maps:
      - { framework: iso-iec-42001-2023, ref: A.6.2.8 }
      - { framework: nist-ai-rmf-1.0, ref: GOVERN 4.3 }
    evidence:
      - kind: test
        file: apps/agent-service/src/agent/graph/spans.test.ts
        name: nests the retrieval store span under agent.node.retrieve
        tier: unit
      - kind: test
        file: apps/agent-service/src/agent/graph/spans.test.ts
        name: nests the write spans under agent.node.reflect
        tier: unit
    note: The GOVERN 4.3 mapping is the weakest in the catalogue — spans enable identifying an incident, and GOVERN 4.3 is about organizational practice.

  - id: CTL-DOC-01
    title: Capability and control claims carry evidence that CI resolves by name
    status: implemented
    maps:
      - { framework: iso-iec-42001-2023, ref: A.6.2.7 }
      - { framework: nist-ai-rmf-1.0, ref: GOVERN 1.4 }
    evidence:
      - { kind: ci, workflow: ci.yml, job: ci, run: yarn lint:docs }
    note: This proves that each cited declaration, test, job or heading exists, not that it holds what the sentence around it says.

  - id: CTL-MEM-01
    title: Long-term memory has one write path, reflect, through memory-core
    status: procedural
    maps:
      - { framework: owasp-asi-2026, ref: ASI06 }
      - { framework: owasp-llm-2025, ref: 'LLM04:2025' }
    evidence:
      - { kind: doc, file: CLAUDE.md, heading: Key Rules }
      - { kind: doc, file: .agents/reviewer.md, heading: Checklist }
    note: Rule 4 of the reviewer checklist. No lint rule or test enforces it.

  - id: CTL-DATA-01
    title: Payer data names only permitted code systems, carries no CPT, and is synthetic by construction; no CPT- or SSN-shaped token enters any tracked file
    status: implemented
    maps:
      - { framework: owasp-llm-2025, ref: 'LLM02:2025' }
      - { framework: nist-ai-rmf-1.0, ref: MAP 4.1 }
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.10 }
    evidence:
      - {
          kind: doc,
          file: docs/adr/0008-code-systems-the-repository-may-contain.md,
          heading: Decision,
        }
      - { kind: symbol, file: scripts/lint-data.mjs, name: lintData }
      - { kind: ci, workflow: ci.yml, job: ci, run: yarn lint:docs }
    note: Delivered by P3-D. lint-data.mjs checks every Coding.system in payer data against ADR 0008's list, the HCPCS Level II and ICD-10-CM shapes, CPT-shaped values, and the synthetic markers (HTEST on every resource, example.org identifiers, no NPI that passes its check digit, digit-suffixed names, 555-01xx telephones); in every other tracked file it fails a CPT shape on a line that names CPT or HCPCS, and an SSN shape anywhere. Its fixture tests run in the same yarn lint:docs step. Narrowed at P3-D's review from "no real PHI or PII, CPT code or proprietary payer content", because no detector can show that a record describing a person is not real or that policy text is not a payer's; that remainder is CTL-DATA-02.

  - id: CTL-DATA-02
    title: No real PHI or PII, and no proprietary payer content, enters the repository
    status: procedural
    maps:
      - { framework: owasp-llm-2025, ref: 'LLM02:2025' }
      - { framework: nist-ai-rmf-1.0, ref: MAP 4.1 }
      - { framework: nist-ai-rmf-1.0, ref: MEASURE 2.10 }
    evidence:
      - {
          kind: doc,
          file: docs/adr/0003-payer-domain-with-licensing-and-phi-as-the-boundary.md,
          heading: Decision,
        }
      - { kind: doc, file: .agents/reviewer.md, heading: Checklist }
    note: Split from CTL-DATA-01 by P3-D. Rule 10 of the reviewer checklist. A reviewer reads for real PHI written to look synthetic, a name without digits in prose, and medical policy text paraphrased from a real payer; CTL-DATA-01's detector cannot see any of them.

  - id: CTL-MEM-02
    title: Memory poisoning is red-teamed against the live write path
    status: planned
    owner: P4-B
    maps:
      - { framework: owasp-asi-2026, ref: ASI06 }
      - { framework: owasp-llm-2025, ref: 'LLM04:2025' }
      - { framework: owasp-llm-2025, ref: 'LLM08:2025' }
      - { framework: nist-ai-600-1, ref: MS-2.7-007 }

  - id: CTL-AGY-01
    title: Every tool declares a reversibility tier, and irreversible calls are compensable
    status: planned
    owner: P4-C
    maps:
      - { framework: owasp-llm-2025, ref: 'LLM06:2025' }
      - { framework: owasp-asi-2026, ref: ASI02 }

  - id: CTL-HUM-01
    title: The agent cannot make or emit an adverse determination, and none exists without a clinician's attestation
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: MAP 3.5 }
      - { framework: nist-ai-rmf-1.0, ref: GOVERN 3.2 }
      - { framework: owasp-asi-2026, ref: ASI09 }
    evidence:
      - {
          kind: doc,
          file: docs/adr/0003-payer-domain-with-licensing-and-phi-as-the-boundary.md,
          heading: Decision,
        }
      - {
          kind: symbol,
          file: packages/determination/src/clinician.ts,
          name: attestAdverseDetermination,
        }
      - kind: test
        file: packages/determination/src/determination.test.ts
        name: rejects kind denial, even when it carries an attestation
        tier: unit
      - kind: test
        file: apps/agent-service/src/clinician-boundary.test.ts
        name: rejects the clinician subpath inside the graph
        tier: unit
      - kind: test
        file: apps/agent-service/src/agent/nodes/egress.node.test.ts
        name: refuses a denial carried under a key it does not declare, rather than stripping it
        tier: unit
      - { kind: ci, workflow: ci.yml, job: ci, run: yarn turbo typecheck }
    note: Delivered by P3-A, narrowed from "no adverse determination is issued without a licensed clinician" to what the types, the lint rule and the strict egress parse enforce. The typecheck step runs the type tests that make an unattested denial fail to compile. P3-D's graph produces the agent's dispositions, and P3-E's review route is the one caller of the constructor (CTL-HUM-02). With a ledger configured, every attestation is recorded in P3-C's tamper-evident ledger (CTL-AUD-01).

  - id: CTL-HUM-02
    title: A clinician's determination is issued only over a signature the service verifies and cannot produce, by a credential the policy lists, once per case
    status: implemented
    maps:
      - { framework: nist-ai-rmf-1.0, ref: GOVERN 3.2 }
      - { framework: nist-ai-rmf-1.0, ref: MAP 3.5 }
      - { framework: owasp-asi-2026, ref: ASI03 }
      - { framework: owasp-asi-2026, ref: ASI09 }
    evidence:
      - {
          kind: doc,
          file: docs/adr/0010-the-prior-auth-case-lives-above-the-graph.md,
          heading: Decision,
        }
      - { kind: symbol, file: apps/agent-service/src/review/signature.ts, name: verifySignature }
      - kind: test
        file: apps/agent-service/test/review.e2e-spec.ts
        name: refuses each malformed, unverified or unqualified determination and leaves the case pended
        tier: service
      - kind: test
        file: apps/agent-service/test/review.e2e-spec.ts
        name: answers a byte-identical resubmission with the stored body, and another determination with 409
        tier: service
      - kind: test
        file: apps/agent-service/src/review/registry.test.ts
        name: refuses the same signature over another case, another key, or garbage
        tier: unit
      - { kind: ci, workflow: ci.yml, job: ci, run: yarn turbo test:service }
    note: Delivered by P3-E. The service holds public keys only, so a stolen service credential cannot mint a denial, and the case id inside the signed bytes stops a signature being replayed onto another case. A signature binds a determination to a key, not to a person; identity proofing and key custody are a deployment's (Before real data), the ledger re-checks every signature against keys it holds as entries, and the credential check is a type match against the policy's list, not a licence check. Authenticating the caller of /review/* is P5-A's.

  - id: CTL-HUM-03
    title: An adverse determination can be appealed, is reconsidered only by a physician who did not make it, and an affirmed or lapsed reconsideration is forwarded to independent review
    status: planned
    owner: P3-F
    maps:
      - { framework: nist-ai-rmf-1.0, ref: GOVERN 3.2 }
      - { framework: nist-ai-rmf-1.0, ref: MANAGE 4.1 }
    note: Planned under P3-F, after 42 CFR § 422.590(h) and § 422.592(a). Non-involvement is enforced against the reviewer who signed the initial determination, not against everyone involved in it, and the forward to the independent entity is a recorded event, not a delivery to an outside system.

  - id: CTL-AUD-01
