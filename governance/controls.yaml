        name: keeps fifty concurrent appends from five pools contiguous
        tier: integration
      - kind: test
        file: apps/agent-service/test/ledger.integration.test.ts
        name: commits one entry per POST /runs, whose digest ledger:verify re-derives
        tier: integration
      - kind: test
        file: apps/agent-service/test/ledger.integration.test.ts
        name: exits 1 naming the run when one of its checkpoint blobs is edited
        tier: integration
      - kind: test
        file: apps/agent-service/test/ledger.integration.test.ts
        name: exits 1 on the anchor when the rewrite reaches an anchored entry
        tier: integration
      - kind: test
        file: apps/agent-service/test/ledger.integration.test.ts
        name: appends one determination.attested entry under the derived id for a denial, and ledger:verify exits 0
        tier: integration
      - kind: test
        file: packages/decision-ledger/src/ledger.test.ts
        name: refuses a determination on a run with a recommendation that does not cite it
        tier: unit
      - { kind: ci, workflow: e2e.yml, job: e2e, run: yarn turbo test:integration }
    note: Delivered by P3-C (ADR 0013). Every run on either graph, every prior-authorization recommendation and every clinician's signed determination is appended to a hash chain of salted commitments, written by ledger_writer, a role with SELECT and INSERT only; ledger:verify re-derives each run's digest from its record and checkpoints and checks every signature against reviewer keys that are themselves entries. A superuser in replica mode can still rewrite the database, so RFC 3161 anchors are what detect a rewrite, and only at or before the last anchor; scheduling anchors, archiving tokens and reviewer-key custody are a deployment's. The repository holds no ePHI (ADR 0003), so the §164.312 mappings describe the safeguard's shape, not a compliance obligation.

  - id: CTL-AUD-02
    title: Every run's inputs and decisions are recorded, and a replay proves the record complete against its checkpoints
    status: implemented
    maps:
